<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#120f1f">
<title>Flip 7 • Contador</title>
<style>
  :root {
    --bg1: #120f1f;
    --bg2: #1a1433;
    --card: #211b3d;
    --card-edge: #322a57;
    --accent: #ff6b35;
    --accent2: #ffd23f;
    --accent3: #4ecdc4;
    --win: #2ecc71;
    --text: #f3f0ff;
    --muted: #9b93b8;
    --danger: #ff4d6d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 20% -10%, #3a2a6b 0%, var(--bg1) 45%) fixed,
                linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", Segoe UI, Roboto, sans-serif;
    touch-action: manipulation;
    overscroll-behavior-y: contain;
  }
  body {
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
  }

  .hero {
    text-align: center;
    margin-bottom: 14px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .logo .card-icon {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #1a1433;
    border-radius: 8px;
    padding: 2px 9px;
    transform: rotate(-6deg);
    box-shadow: 0 4px 14px rgba(255,107,53,0.4);
  }
  .sub {
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 4px;
  }

  .goal-card {
    max-width: 480px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, rgba(255,107,53,0.14), rgba(255,210,63,0.08));
    border: 1px solid var(--card-edge);
    border-radius: 16px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .goal-card label {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .goal-card input {
    width: 72px;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    padding: 6px 4px;
    border-radius: 10px;
    border: 1px solid var(--card-edge);
    background: #0f0c22;
    color: var(--accent2);
  }

  #players {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 480px;
    margin: 0 auto;
  }

  .player {
    position: relative;
    background: linear-gradient(145deg, var(--card), #1c1735);
    border-radius: 18px;
    padding: 14px 16px;
    border: 1px solid var(--card-edge);
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    overflow: hidden;
    transition: box-shadow .25s, border-color .25s, transform .2s;
  }
  .player::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: var(--stripe, var(--accent3));
    border-radius: 6px 0 0 6px;
  }
  .player.winner {
    border-color: var(--win);
    box-shadow: 0 0 0 2px var(--win), 0 10px 28px rgba(46,204,113,0.35);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }

  .player-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .name-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .avatar {
    font-size: 1.3rem;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--stripe, var(--accent3));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15);
  }
  .player .name {
    font-weight: 700;
    font-size: 1.05rem;
    background: transparent;
    border: none;
    color: var(--text);
    width: 100%;
    outline: none;
    min-width: 0;
  }
  .remove-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    flex-shrink: 0;
  }
  .remove-btn:active { color: var(--danger); }

  .player-bottom {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 10px;
  }
  .round-input {
    width: 100%;
    padding: 12px 8px;
    text-align: center;
    border-radius: 12px;
    border: 1px solid var(--card-edge);
    background: #0f0c22;
    color: var(--text);
    font-size: 1.1rem;
    font-weight: 600;
  }
  .round-input::placeholder { color: var(--muted); font-weight: 400; }

  .add-btn {
    background: linear-gradient(135deg, var(--accent), #ff8c5a);
    color: #1a1433;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-weight: 800;
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255,107,53,0.4);
    min-width: 50px;
  }
  .add-btn:active { transform: scale(0.92); }

  .total {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--accent3);
    min-width: 58px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    transition: color .2s;
  }
  .player.winner .total { color: var(--win); }
  .total.bump { animation: bump .3s ease; }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  .progress-track {
    margin-top: 10px;
    height: 6px;
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--accent3), var(--accent2));
    transition: width .4s ease;
  }
  .player.winner .progress-fill { background: var(--win); }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px auto 0;
    max-width: 480px;
    flex-wrap: wrap;
  }
  .toolbar button {
    flex: 1;
    min-width: 110px;
    padding: 13px 10px;
    border-radius: 14px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.92rem;
  }
  #addPlayerBtn {
    background: linear-gradient(135deg, var(--accent3), #6fe7df);
    color: #0f0c22;
  }
  #resetRoundBtn {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--card-edge) !important;
  }
  #resetAllBtn {
    background: linear-gradient(135deg, var(--danger), #ff7a93);
    color: #1a1433;
  }
  .toolbar button:active { transform: scale(0.96); }

  .history {
    max-width: 480px;
    margin: 18px auto 0;
    font-size: 0.78rem;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.3px;
  }

  .trophy-banner {
    max-width: 480px;
    margin: 0 auto 14px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 800;
    padding: 12px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(46,204,113,0.25), rgba(78,205,196,0.15));
    border: 1px solid var(--win);
    display: none;
  }
  .trophy-banner.show { display: block; animation: pulse 1.6s ease-in-out infinite; }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="hero">
  <div class="logo"><span class="card-icon">7</span> FLIP 7</div>
  <div class="sub">Contador de pontos • primeiro a bater a meta vence</div>
</div>

<div class="goal-card">
  <label>Meta</label>
  <input type="number" id="goal" value="200" inputmode="numeric">
  <label>pts</label>
</div>

<div class="trophy-banner" id="trophy">🏆 <span id="winnerName"></span> venceu!</div>

<div id="players"></div>

<div class="toolbar">
  <button id="addPlayerBtn">＋ Jogador</button>
  <button id="resetRoundBtn">Limpar campos</button>
  <button id="resetAllBtn">Nova partida</button>
</div>

<div class="history" id="roundCount"></div>

<script>
const STORAGE_KEY = 'flip7_state_v2';
const STRIPES = ['#4ecdc4', '#ff6b35', '#ffd23f', '#c77dff', '#5ec8ff', '#ff8fa3'];
const AVATARS = ['🦊','🐯','🐸','🐼','🦁','🐨'];

let state = load() || {
  goal: 200,
  players: [
    { name: 'Jogador 1', total: 0, rounds: 0 },
    { name: 'Jogador 2', total: 0, rounds: 0 }
  ]
};

function safeStorage() {
  try {
    const k = '__t__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  } catch (e) { return false; }
}
const STORAGE_OK = safeStorage();

function load() {
  if (!STORAGE_OK) return null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function save() {
  if (!STORAGE_OK) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

const playersEl = document.getElementById('players');
const goalInput = document.getElementById('goal');
const trophyEl = document.getElementById('trophy');
const winnerNameEl = document.getElementById('winnerName');
const roundCountEl = document.getElementById('roundCount');

goalInput.value = state.goal;
goalInput.addEventListener('input', () => {
  state.goal = parseInt(goalInput.value) || 200;
  save();
  render();
});

function render(bumpIndex) {
  playersEl.innerHTML = '';
  let winner = null;
  let maxRounds = 0;

  state.players.forEach((p) => {
    if (p.rounds > maxRounds) maxRounds = p.rounds;
    if (p.total >= state.goal && (!winner || p.total > winner.total)) winner = p;
  });

  state.players.forEach((p, i) => {
    const isWinner = p.total >= state.goal;
    const div = document.createElement('div');
    div.className = 'player' + (isWinner ? ' winner' : '');
    div.style.setProperty('--stripe', STRIPES[i % STRIPES.length]);

    const top = document.createElement('div');
    top.className = 'player-top';

    const nameWrap = document.createElement('div');
    nameWrap.className = 'name-wrap';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = AVATARS[i % AVATARS.length];

    const nameInput = document.createElement('input');
    nameInput.className = 'name';
    nameInput.value = p.name;
    nameInput.addEventListener('input', () => {
      state.players[i].name = nameInput.value;
      save();
    });

    nameWrap.appendChild(avatar);
    nameWrap.appendChild(nameInput);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = '✕';
    removeBtn.title = 'remover jogador';
    removeBtn.addEventListener('click', () => {
      state.players.splice(i, 1);
      save();
      render();
    });

    top.appendChild(nameWrap);
    top.appendChild(removeBtn);

    const bottom = document.createElement('div');
    bottom.className = 'player-bottom';

    const roundInput = document.createElement('input');
    roundInput.className = 'round-input';
    roundInput.type = 'number';
    roundInput.inputMode = 'numeric';
    roundInput.placeholder = 'pts da rodada';
    roundInput.id = 'round-' + i;
    roundInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addRound(i);
    });

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'add-btn';
    addBtn.textContent = '＋';
    addBtn.addEventListener('click', () => addRound(i));

    const totalSpan = document.createElement('div');
    totalSpan.className = 'total';
    if (bumpIndex === i) totalSpan.classList.add('bump');
    totalSpan.textContent = p.total;

    bottom.appendChild(roundInput);
    bottom.appendChild(addBtn);
    bottom.appendChild(totalSpan);

    const progressTrack = document.createElement('div');
    progressTrack.className = 'progress-track';
    const progressFill = document.createElement('div');
    progressFill.className = 'progress-fill';
    const pct = Math.min(100, Math.max(0, (p.total / state.goal) * 100));
    progressFill.style.width = pct + '%';
    progressTrack.appendChild(progressFill);

    div.appendChild(top);
    div.appendChild(bottom);
    div.appendChild(progressTrack);

    playersEl.appendChild(div);
  });

  if (winner) {
    trophyEl.classList.add('show');
    winnerNameEl.textContent = winner.name;
  } else {
    trophyEl.classList.remove('show');
  }

  roundCountEl.textContent = 'Rodadas jogadas: ' + maxRounds;
}

function addRound(i) {
  const input = document.getElementById('round-' + i);
  const val = parseInt(input.value);
  if (!isNaN(val)) {
    const wasWinner = state.players[i].total >= state.goal;
    state.players[i].total += val;
    state.players[i].rounds += 1;
    input.value = '';
    save();
    render(i);
    if (!wasWinner && state.players[i].total >= state.goal) {
      fireConfetti();
    }
  }
}

document.getElementById('addPlayerBtn').addEventListener('click', () => {
  if (state.players.length >= 6) {
    alert('Máximo de 6 jogadores.');
    return;
  }
  state.players.push({ name: 'Jogador ' + (state.players.length + 1), total: 0, rounds: 0 });
  save();
  render();
});

document.getElementById('resetRoundBtn').addEventListener('click', () => {
  document.querySelectorAll('.round-input').forEach(inp => inp.value = '');
});

document.getElementById('resetAllBtn').addEventListener('click', () => {
  if (confirm('Zerar pontos de todos os jogadores? (mantém os nomes)')) {
    state.players.forEach(p => { p.total = 0; p.rounds = 0; });
    save();
    render();
  }
});

// --- confetti ---
const canvas = document.getElementById('confettiCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function fireConfetti() {
  const colors = ['#ff6b35', '#ffd23f', '#4ecdc4', '#c77dff', '#5ec8ff', '#2ecc71'];
  const particles = [];
  for (let i = 0; i < 140; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.3,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4,
      size: 5 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      vr: (Math.random() - 0.5) * 10
    });
  }
  let frame = 0;
  const maxFrames = 150;
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.6);
      ctx.restore();
    });
    frame++;
    if (frame < maxFrames) {
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  tick();
}

render();
</script>
</body>
</html>
